<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Uji dollhouse 3D Okina — JGS Group</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96">
  <meta name="theme-color" content="#1b2a64">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    /* Halaman uji: dollhouse 3D tipe Okina 61. Model dari DAE SketchUp (source-3d),
       perabot digambar Three.js, dua titik per ruangan membuka gambar render statis.
       Buka dengan ?edit=1 untuk mode editor: klik lantai → koordinat untuk dollhouse.json. */
    :root{--ink:#15203b;--ink-2:#4a5470;--muted:#858ca3;--line:#e2dfd6;--navy:#1b2a64;--merah:#e0213f;color-scheme:light}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#e9eef4;color:var(--ink);font-family:"Manrope",system-ui,sans-serif;font-size:16px;line-height:1.45;overflow:hidden;overscroll-behavior:none}
    #panggung{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 10%,#f6f8fb 0%,#dfe6ef 55%,#c9d4e2 100%)}
    #panggung canvas{display:block;width:100%;height:100%;touch-action:none}
    .judul{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top));z-index:3;display:flex;flex-direction:column;gap:2px;pointer-events:none}
    .judul .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--merah);font-weight:700}
    .judul h1{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:clamp(22px,3vw,34px);margin:0;line-height:1.05;letter-spacing:-.012em}
    .judul p{margin:0;font-size:13px;color:var(--ink-2)}
    .lantai{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;display:flex;gap:4px;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:999px;padding:4px;box-shadow:0 18px 40px -18px rgba(15,23,51,.45)}
    .lantai button{appearance:none;border:0;background:transparent;font:inherit;font-weight:600;font-size:14px;color:var(--ink-2);padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
    .lantai button[aria-pressed="true"]{background:var(--navy);color:#fff}
    .petunjuk{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top));z-index:3;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(21,32,59,.7);background:rgba(255,255,255,.6);padding:6px 12px;border-radius:999px;backdrop-filter:blur(6px)}
    @media (max-width:640px){.petunjuk{display:none}}
    .muat{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#e9eef4;transition:opacity .5s}
    .muat.sembunyi{opacity:0;pointer-events:none}
    .muat div{width:min(260px,60vw);height:3px;background:rgba(27,42,100,.15);border-radius:3px;overflow:hidden}
    .muat i{display:block;height:100%;width:0;background:var(--navy);transition:width .2s}
    /* titik ruangan */
    #titik{position:fixed;inset:0;z-index:2;pointer-events:none}
    .pin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;appearance:none;border:0;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .25s}
    .pin.tampak{opacity:1}
    .pin b{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--navy);display:grid;place-items:center;color:var(--navy);font-size:12px;font-weight:700;box-shadow:0 6px 16px -4px rgba(15,23,51,.5);position:relative}
    .pin b::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid rgba(27,42,100,.45);animation:denyut 2s ease-out infinite}
    @keyframes denyut{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.35);opacity:0}}
    .pin span{display:none;font-size:12px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.85);padding:4px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 16px -8px rgba(15,23,51,.5)}
    @media (hover:hover){.pin:hover span,.pin:focus-visible span{display:inline}}
    .pin:hover b,.pin:focus-visible b{background:var(--navy);color:#fff}
    /* lightbox */
    .kotak{position:fixed;inset:0;z-index:10;background:rgba(10,16,38,.86);display:none;align-items:center;justify-content:center;padding:16px}
    .kotak.buka{display:flex}
    .kotak figure{margin:0;max-width:min(1100px,100%);width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
    .kotak img{max-width:100%;max-height:72vh;border-radius:14px;box-shadow:0 40px 80px -30px rgba(0,0,0,.8);background:#223}
    .kotak figcaption{color:#fff;text-align:center;display:flex;flex-direction:column;gap:2px}
    .kotak figcaption b{font-family:"Fraunces",serif;font-weight:500;font-size:22px}
    .kotak figcaption span{font-size:13px;color:rgba(255,255,255,.75)}
    .kotak .tutup,.kotak .nav{position:absolute;appearance:none;border:0;background:rgba(255,255,255,.12);color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;display:grid;place-items:center}
    .kotak .tutup{right:16px;top:calc(16px + env(safe-area-inset-top))}
    .kotak .nav{top:50%;transform:translateY(-50%)}
    .kotak .nav.kiri{left:12px}.kotak .nav.kanan{right:12px}
    /* editor */
    .editor{position:fixed;left:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:4;width:min(360px,calc(100vw - 32px));background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12px;display:none;flex-direction:column;gap:8px;max-height:50vh}
    .editor.buka{display:flex}
    .editor textarea{width:100%;flex:1;min-height:120px;font:11px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
    .editor .baris{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .editor button{font:inherit;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;cursor:pointer}
  </style>
</head>
<body>
  <div id="panggung"></div>
  <div id="titik" aria-live="polite"></div>

  <div class="judul">
    <span class="eyebrow">Kawa Living · Halaman uji</span>
    <h1>Okina 61 — jelajah 3D</h1>
    <p>Putar dengan seret, cubit untuk zoom, ketuk titik untuk melihat ruangan.</p>
  </div>
  <div class="petunjuk">Seret = putar · Scroll = zoom · Klik kanan = geser</div>

  <div class="lantai" role="group" aria-label="Pilih lantai">
    <button type="button" data-lantai="1" aria-pressed="true">Lantai 1</button>
    <button type="button" data-lantai="2" aria-pressed="false">Lantai 2</button>
    <button type="button" data-lantai="0" aria-pressed="false">Rumah utuh</button>
  </div>

  <div class="editor" id="editor">
    <div class="baris"><b>Mode editor</b> — klik lantai/perabot untuk mengambil koordinat.
      <button type="button" id="ed-salin">Salin</button><button type="button" id="ed-hapus">Kosongkan</button></div>
    <div class="baris" id="ed-info">—</div>
    <textarea id="ed-log" readonly placeholder="koordinat muncul di sini"></textarea>
  </div>

  <div class="kotak" id="kotak" role="dialog" aria-modal="true" aria-label="Gambar ruangan">
    <button type="button" class="tutup" aria-label="Tutup">×</button>
    <button type="button" class="nav kiri" aria-label="Sebelumnya">‹</button>
    <figure><img alt=""><figcaption><b></b><span></span></figcaption></figure>
    <button type="button" class="nav kanan" aria-label="Berikutnya">›</button>
  </div>

  <div class="muat" id="muat"><div><i></i></div></div>

  <script type="module" src="dollhouse.js?v=20261025c"></script>
</body>
</html>
